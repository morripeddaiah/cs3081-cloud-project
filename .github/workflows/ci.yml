name: CI/CD Pipeline & Model Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-scan:
    name: Lint & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint Python Code
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.git,__pycache__,venv

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install transformers pydantic

      - name: Run Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Stateless NACL Simulator Verification
        run: |
          python tools/nacl_sim.py network/nacl.json network/packets_sample.jsonl --check

  model-eval-and-gate:
    name: Model Quality Gate
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install transformers

      - name: Download Model Artifacts from GitHub Release
        id: download-model
        run: |
          mkdir -p models/v1
          # Attempt to fetch release assets using gh CLI if release exists,
          # otherwise fall back to base Pythia model or cached weights
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download v1.0.0 --repo "${{ github.repository }}" --dir models/v1
          else
            echo "Release v1.0.0 not found; using Pythia-70m base model checkpoint for verification."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate Predictions from Release Model
        run: |
          python training/evaluate.py --mode student --model-path models/v1 \
            --gold data/validation.jsonl \
            --out-preds results/ci_preds.jsonl \
            --out-report results/ci_report.json

      - name: Quality Gate (min-validity 95%)
        run: |
          python tools/score.py results/ci_preds.jsonl data/validation.jsonl \
            --out results/ci_gate_report.json --min-validity 95

