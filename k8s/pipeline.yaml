apiVersion: batch/v1
kind: Job
metadata:
  name: teacher-worker-shard-0
  namespace: pipeline
spec:
  template:
    metadata:
      labels:
        app: teacher-worker
        shard: "0"
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: python:3.11-slim
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir boto3 requests
              python /app/worker.py
          env:
            - name: SHARD_INDEX
              value: "0"
            - name: SHARD_COUNT
              value: "2"
            - name: OLLAMA_HOST
              value: "http://host.k3d.internal:11434"
            - name: S3_ENDPOINT
              value: "http://seaweedfs.data.svc.cluster.local:8333"
            - name: S3_BUCKET
              value: "datasets"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
