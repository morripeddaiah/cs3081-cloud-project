# Training Configuration for Command-Parsing Student Model
model:
  base_model: "EleutherAI/pythia-70m"
  max_seq_len: 128
  pad_token: "<|endoftext|>"

training:
  seed: 42
  learning_rate: 5.0e-4
  batch_size: 16
  gradient_accumulation_steps: 2
  epochs: 3
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: false
  dataloader_num_workers: 0
  logging_steps: 25
  save_total_limit: 2

data:
  train_file: "datasets/v1/train.jsonl"
  validation_file: "data/validation.jsonl"
  max_train_samples: 1500
  prompt_template: "Command: {command}\nJSON: {json_target}"

environment:
  device: "cpu"
  torch_version: "2.1.0"
  transformers_version: "4.36.0"
  accelerate_version: "0.25.0"
