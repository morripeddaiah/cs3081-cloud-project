apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: command-parser-ingress
  namespace: app
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service:
                name: command-parser-service
                port:
                  number: 8000
          - path: /healthz
            pathType: Prefix
            backend:
              service:
                name: command-parser-service
                port:
                  number: 8000
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: command-parser-service
                port:
                  number: 8000

